services:
  redis:
    image: redis:7-alpine
    container_name: redis-local
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data

    command: redis-server /usr/local/etc/redis/redis.conf

volumes:
  redis-data: